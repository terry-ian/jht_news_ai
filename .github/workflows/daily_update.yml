name: Daily News Scraper Update

on:
  schedule:
    # 每天 UTC 00:00 執行 (相當於台灣時間 AM 08:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # 支援在 GitHub 介面上手動點擊觸發測試

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 賦予寫入 Git 儲存庫的權限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f scraper/requirements.txt ]; then pip install -r scraper/requirements.txt; fi

      - name: Run news scraper
        run: python scraper/fetch_news.py

      - name: Commit and push updated news.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          # 檢查 data/news.json 是否有內容變更，有變更才進行 commit 與 push
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update data/news.json [skip ci]" && git push)
